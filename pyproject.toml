[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "him-workbench"
version = "0.0.1"
description = "Local-first Health Information Management tools built on public standards, synthetic data only."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["flask>=3"]
powerbi = ["openpyxl>=3.1"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
him_workbench = ["templates/*.html", "static/*"]
